<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="pt">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap demo</title>
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    </head>
    <body>
        <section class="container">

            <h1 th:text="${usuario.id} ? |Usuario #${usuario.id}| : 'Novo Usuário'">Usuario #4</h1>
            
            <form method="POST" action="#" th:action="@{/usuario}" th:object="${usuario}">
                
                <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors()}">
                    <p th:if="${#fields.hasErrors('nome')}">Nome: <span th:errors="*{nome}"></span></p>
                    <p th:if="${#fields.hasErrors('username')}">Username: <span th:errors="*{username}"></span></p>
                    <p th:if="${#fields.hasErrors('idade')}">Idade: <span th:errors="*{idade}"></span></p>
                    <p th:if="${#fields.hasErrors('urlImagem')}">URL: <span th:errors="*{urlImagem}"></span></p>
                </div>
                
                <input type="hidden" class="form-control" id="usuario_id" th:field="*{id}">
                    
                <div class="form-group row">
                    <label for="usuario_username" class="col-sm-2 col-form-label">Username</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control" id="usuario_username" th:field="*{username}">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="usuarioNome" class="col-sm-2 col-form-label">Nome</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control" id="usuario_nome" th:field="*{nome}">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="usuario_idade" class="col-sm-2 col-form-label">Idade</label>
                    <div class="col-sm-10">
                    <input type="number" class="form-control" id="usuario_idade" min="-999" max="120" th:field="*{idade}">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="usuario_url_imagem" class="col-sm-2 col-form-label">URL</label>
                    <div class="col-sm-10">
                      <input type="text" class="form-control" id="usuario_url_imagem" th:field="*{urlImagem}">
                    </div>
                </div>
                
                <div class="form-group row">
                    <div class="col-sm-10">
                      <button type="submit" class="btn btn-primary">Enviar</button>
                    </div>
                </div>
            </form>
            
            <a class="btn btn-secondary"
                th:href="@{/usuario}">
                Voltar
            </a>
            
        </section>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
